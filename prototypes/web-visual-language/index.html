<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Throwaway prototype: three visual-language directions for the OTTY Product Landing and Documentation."
    />
    <title>OTTY web visual language — prototype</title>
    <link rel="icon" href="../../public/assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="prototype.css" />
    <script src="prototype.js" defer></script>
  </head>
  <body data-variant="A" data-view="landing">
    <!--
      PROTOTYPE — throw away after the visual-language decision.
      Three structurally different directions, switchable with ?variant=A|B|C.
    -->
    <noscript>
      <p class="noscript">This local design prototype needs JavaScript to switch between variants.</p>
    </noscript>

    <div id="app"></div>

    <aside class="prototype-switcher" aria-label="Prototype controls">
      <div class="prototype-switcher__views" aria-label="Surface">
        <button type="button" data-prototype-view="landing">Landing</button>
        <button type="button" data-prototype-view="docs">Docs</button>
        <button type="button" data-prototype-view="install">Install</button>
      </div>
      <div class="prototype-switcher__variants">
        <button type="button" class="prototype-switcher__arrow" data-prototype-prev aria-label="Previous variant">
          ←
        </button>
        <output class="prototype-switcher__label" data-prototype-label aria-live="polite"></output>
        <button type="button" class="prototype-switcher__arrow" data-prototype-next aria-label="Next variant">
          →
        </button>
      </div>
    </aside>
  </body>
</html>
